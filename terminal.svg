<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="100%" height="390">
  <defs>
    <!-- Glow effects -->
    <filter id="neon-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    <![CDATA[
    .terminal-window {
      fill: #1a1b26;
      stroke: #3b4261;
      stroke-width: 2;
    }

    .terminal-header {
      fill: #1f2335;
    }

    .text-cmd {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      fill: #9ece6a;
      font-weight: bold;
    }

    .text-cmd-prompt {
      fill: #f75c7f;
    }

    .text-cmd-arg {
      fill: #c0caf5;
    }

    .text-info {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #c0caf5;
    }

    .text-label {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #7aa2f7;
      font-weight: bold;
    }

    .dot-red { fill: #f7768e; }
    .dot-yellow { fill: #e0af68; }
    .dot-green { fill: #9ece6a; }

    /* Cursor blink */
    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: cursor-blink 1s steps(2) infinite;
      fill: #00f0ff;
    }

    /* Staggered text typing animation simulation */
    @keyframes type-fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .line-1 { animation: type-fade 0.4s steps(1) forwards; }
    .line-2 { animation: type-fade 0.4s steps(1) 0.4s forwards; opacity: 0; }
    .line-3 { animation: type-fade 0.4s steps(1) 0.8s forwards; opacity: 0; }
    .line-4 { animation: type-fade 0.4s steps(1) 1.2s forwards; opacity: 0; }
    .line-5 { animation: type-fade 0.4s steps(1) 1.6s forwards; opacity: 0; }

    /* ASCII Cat Idle Animation (Frame-by-frame blink) */
    @keyframes ascii-idle-f1 {
      0%, 88%, 100% { opacity: 1; }
      90%, 96% { opacity: 0; }
    }
    @keyframes ascii-idle-f2 {
      0%, 88%, 100% { opacity: 0; }
      90%, 96% { opacity: 1; }
    }
    .cat-ascii-frame1 {
      animation: ascii-idle-f1 4s steps(1) infinite;
    }
    .cat-ascii-frame2 {
      animation: ascii-idle-f2 4s steps(1) infinite;
    }

    /* Intro Open animation */
    @keyframes panel-open {
      0% { transform: scaleX(0.01); opacity: 0.8; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    .terminal-window, .terminal-header {
      transform-origin: 400px 195px;
      animation: panel-open 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes content-reveal {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .panel-content {
      animation: content-reveal 0.4s ease-out 0.6s forwards;
      opacity: 0;
    }
    ]]>
  </style>

  <!-- ================= TERMINAL WINDOW CONTAINER ================= -->
  <!-- Outer window border and body -->
  <rect x="10" y="10" width="780" height="370" rx="8" class="terminal-window" />
  
  <!-- Header title bar -->
  <path d="M10,18 C10,13.5 13.5,10 18,10 H782 C786.5,10 790,13.5 790,18 V38 H10 Z" class="terminal-header" />
  
  <!-- MacOS style window dots -->
  <g class="panel-content">
    <circle cx="30" cy="24" r="6" class="dot-red" />
    <circle cx="50" cy="24" r="6" class="dot-yellow" />
    <circle cx="70" cy="24" r="6" class="dot-green" />
    
    <!-- Header Title -->
    <text x="400" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#565f89" font-weight="bold">neko-san@system: ~</text>

    <!-- ================= CYBERPUNK TERMINAL CONTENT ================= -->
    <g transform="translate(35, 70)">
    <!-- Command Prompt 1 -->
    <text x="0" y="0" class="text-cmd line-1">
      <tspan class="text-cmd-prompt">neko-san:~$</tspan> <tspan class="text-cmd-arg">neofetch</tspan>
    </text>
    
    <!-- Neofetch Output -->
    <g class="line-2">
      <!-- ASCII Art (8-bit Cat with idle animation) -->
      <g transform="translate(10, 20)" fill="#7aa2f7" font-family="monospace" font-size="14" font-weight="bold">
        <!-- Frame 1: Normal State -->
        <g class="cat-ascii-frame1">
          <text x="0" y="15">   /\_/\   </text>
          <text x="0" y="32">  (='v'=)  </text>
          <text x="0" y="49">  (&quot;)_(&quot;)~  </text>
        </g>
        <!-- Frame 2: Blinking -->
        <g class="cat-ascii-frame2">
          <text x="0" y="15">   /\_/\   </text>
          <text x="0" y="32">  (=-=-=)  </text>
          <text x="0" y="49">  (&quot;)_(&quot;)/  </text>
        </g>
      </g>

      <!-- System Info Details -->
      <g transform="translate(125, 20)">
        <text x="0" y="15" class="text-label">OS: <tspan class="text-info" font-weight="normal">NekoOS v1.4.32</tspan></text>
        <text x="0" y="35" class="text-label">KERNEL: <tspan class="text-info" font-weight="normal">TypeScript / Node.js</tspan></text>
        <text x="0" y="55" class="text-label">UPTIME: <tspan class="text-info" font-weight="normal">Active 24/7 (Actions)</tspan></text>
        <text x="0" y="75" class="text-label">LAST SYNC: <tspan class="text-info" font-weight="normal">Jul 13, 2026 19:07 UTC</tspan></text>
      </g>
    </g>

    <!-- Command Prompt 2 -->
    <text x="0" y="125" class="text-cmd line-3">
      <tspan class="text-cmd-prompt">neko-san:~$</tspan> <tspan class="text-cmd-arg">github-contribution</tspan>
    </text>

    <!-- GitHub Contribution ASCII Art -->
    <g transform="translate(10, 145)" class="line-4">
      <text x="0" y="15" class="text-label" font-size="12">CONTRIBUTIONS (LAST 4 WEEKS):</text>
      <g transform="translate(0, 30)" font-family="'Courier New', monospace" font-size="13" font-weight="bold" xml:space="preserve">
        <text x="0" y="12" fill="#7aa2f7">Mon  <tspan fill="#3b4261">■</tspan> <tspan fill="#9ece6a">■</tspan> <tspan fill="#7aa2f7">■</tspan> <tspan fill="#3b4261">■</tspan>  <tspan fill="#9ece6a">■</tspan> <tspan fill="#7aa2f7">■</tspan> <tspan fill="#00f0ff">■</tspan> <tspan fill="#9ece6a">■</tspan>  <tspan fill="#3b4261">■</tspan> <tspan fill="#3b4261">■</tspan> <tspan fill="#9ece6a">■</tspan> <tspan fill="#7aa2f7">■</tspan>  <tspan fill="#9ece6a">■</tspan> <tspan fill="#00f0ff">■</tspan> <tspan fill="#7aa2f7">■</tspan></text>
        <text x="0" y="28" fill="#7aa2f7">Wed  <tspan fill="#9ece6a">■</tspan> <tspan fill="#7aa2f7">■</tspan> <tspan fill="#3b4261">■</tspan> <tspan fill="#9ece6a">■</tspan>  <tspan fill="#7aa2f7">■</tspan> <tspan fill="#3b4261">■</tspan> <tspan fill="#9ece6a">■</tspan> <tspan fill="#7aa2f7">■</tspan>  <tspan fill="#00f0ff">■</tspan> <tspan fill="#9ece6a">■</tspan> <tspan fill="#3b4261">■</tspan> <tspan fill="#3b4261">■</tspan>  <tspan fill="#7aa2f7">■</tspan> <tspan fill="#9ece6a">■</tspan> <tspan fill="#00f0ff">■</tspan></text>
        <text x="0" y="44" fill="#7aa2f7">Fri  <tspan fill="#3b4261">■</tspan> <tspan fill="#9ece6a">■</tspan> <tspan fill="#00f0ff">■</tspan> <tspan fill="#7aa2f7">■</tspan>  <tspan fill="#3b4261">■</tspan> <tspan fill="#9ece6a">■</tspan> <tspan fill="#7aa2f7">■</tspan> <tspan fill="#3b4261">■</tspan>  <tspan fill="#9ece6a">■</tspan> <tspan fill="#7aa2f7">■</tspan> <tspan fill="#00f0ff">■</tspan> <tspan fill="#9ece6a">■</tspan>  <tspan fill="#3b4261">■</tspan> <tspan fill="#7aa2f7">■</tspan> <tspan fill="#9ece6a">■</tspan></text>
      </g>
      <text x="0" y="105" class="text-info" font-size="12">Status: <tspan fill="#9ece6a" font-weight="bold">Active</tspan> | Total Commits: <tspan fill="#00f0ff" font-weight="bold">2,432</tspan> this season.</text>
    </g>

    <!-- Final Prompt -->
    <text x="0" y="285" class="text-cmd line-5">
      <tspan class="text-cmd-prompt">neko-san:~$</tspan> <rect x="95" y="-12" width="8" height="15" class="cursor" />
    </text>
  </g>
  </g>
</svg>
