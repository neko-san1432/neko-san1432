<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <!-- Futuristic Neon Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#bd00ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <style>
    <![CDATA[
    /* CSS Styles & Animations */
    .ground-line {
      stroke: #00f0ff;
      stroke-width: 4;
      stroke-dasharray: 16 8;
      opacity: 0.6;
      filter: drop-shadow(0px 0px 4px #00f0ff);
      animation: scroll-ground 0.8s linear infinite;
    }

    @keyframes scroll-ground {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 24; }
    }

    /* 8-bit text wave animation with neon cyber glow */
    .pixel-letter {
      fill: url(#text-grad);
      filter: drop-shadow(0px 0px 8px rgba(0, 240, 255, 0.8)) drop-shadow(0px 0px 15px rgba(189, 0, 255, 0.5));
      animation: letter-wave 1.6s ease-in-out infinite;
    }

    @keyframes letter-wave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* 8-bit walking translations (discrete pixel steps) */
    @keyframes walk-in-left {
      0% { transform: translate(-60px, 122px); }
      70% { transform: translate(235px, 122px); }
      100% { transform: translate(235px, 122px); }
    }

    @keyframes walk-in-right {
      0% { transform: translate(810px, 122px); }
      70% { transform: translate(528px, 122px); }
      100% { transform: translate(528px, 122px); }
    }

    /* Wobble walking animation (discrete 8-bit steps) */
    @keyframes walking-wobble {
      0%, 10%, 20%, 30%, 40%, 50%, 60% { transform: translateY(0px) rotate(-4deg); }
      5%, 15%, 25%, 35%, 45%, 55%, 65% { transform: translateY(-6px) rotate(4deg); }
      70%, 100% { transform: translateY(0px) rotate(0deg); }
    }

    /* Continuous idle animations */
    @keyframes idle-tail-wag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }

    @keyframes idle-breath {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }

    /* Animation class assignments */
    .left-cat-container {
      animation: walk-in-left 5s steps(28) forwards;
    }

    .right-cat-container {
      animation: walk-in-right 5s steps(28) forwards;
    }

    .cat-wobble {
      animation: walking-wobble 5s steps(14) forwards;
    }

    .cat-breath {
      animation: idle-breath 3s steps(4) infinite;
    }

    .tail-left {
      transform-origin: 2px 12px;
      animation: idle-tail-wag 1.6s steps(4) infinite;
    }

    .tail-right {
      transform-origin: 13px 12px;
      animation: idle-tail-wag 1.4s steps(4) infinite;
    }
    ]]>
  </style>

  <!-- ================= MOVING NEON GROUND LINE ================= -->
  <line x1="-50" y1="165" x2="850" y2="165" class="ground-line" />

  <!-- ================= 8-BIT TEXT WAVE (PYRRHUS) ================= -->
  <g transform="translate(0, 85)" shape-rendering="crispEdges">
    <!-- P (X = 276) -->
    <path class="pixel-letter" style="animation-delay: 0.0s;" d="M276,0 h20 v5 h-20 z M276,5 h5 v30 h-5 z M296,5 h5 v10 h-5 z M281,15 h15 v5 h-15 z" />
    
    <!-- Y (X = 313) -->
    <path class="pixel-letter" style="animation-delay: 0.15s;" d="M313,0 h5 v10 h-5 z M333,0 h5 v10 h-5 z M318,10 h5 v5 h-5 z M328,10 h5 v5 h-5 z M323,15 h5 v20 h-5 z" />
    
    <!-- R (X = 350) -->
    <path class="pixel-letter" style="animation-delay: 0.3s;" d="M350,0 h20 v5 h-20 z M350,5 h5 v30 h-5 z M370,5 h5 v10 h-5 z M355,15 h15 v5 h-15 z M360,20 h5 v5 h-5 z M365,25 h5 v5 h-5 z M370,30 h5 v5 h-5 z" />
    
    <!-- R (X = 387) -->
    <path class="pixel-letter" style="animation-delay: 0.45s;" d="M387,0 h20 v5 h-20 z M387,5 h5 v30 h-5 z M407,5 h5 v10 h-5 z M392,15 h15 v5 h-15 z M397,20 h5 v5 h-5 z M402,25 h5 v5 h-5 z M407,30 h5 v5 h-5 z" />
    
    <!-- H (X = 424) -->
    <path class="pixel-letter" style="animation-delay: 0.6s;" d="M424,0 h5 v35 h-5 z M444,0 h5 v35 h-5 z M429,15 h15 v5 h-15 z" />
    
    <!-- U (X = 461) -->
    <path class="pixel-letter" style="animation-delay: 0.75s;" d="M461,0 h5 v30 h-5 z M481,0 h5 v30 h-5 z M466,30 h15 v5 h-15 z" />
    
    <!-- S (X = 498) -->
    <path class="pixel-letter" style="animation-delay: 0.9s;" d="M503,0 h20 v5 h-20 z M498,5 h5 v10 h-5 z M503,15 h15 v5 h-15 z M518,20 h5 v10 h-5 z M498,30 h20 v5 h-20 z" />
  </g>

  <!-- ================= LEFT CAT (Cyber-Blue Theme) ================= -->
  <g class="left-cat-container">
    <g class="cat-wobble">
      <g class="cat-breath" style="animation-delay: 0.2s;">
        <g transform="scale(3)" shape-rendering="crispEdges">
          <!-- Tail -->
          <g class="tail-left">
            <rect x="1" y="11" width="1" height="2" fill="#1f2335" />
            <rect x="0" y="9" width="1" height="2" fill="#1f2335" />
            <rect x="1" y="8" width="1" height="1" fill="#1f2335" />
          </g>
          <!-- Body/Head -->
          <rect x="2" y="1" width="1" height="2" fill="#1f2335" />
          <rect x="3" y="2" width="1" height="2" fill="#ff007f" />
          <rect x="4" y="2" width="1" height="2" fill="#1f2335" />
          <rect x="12" y="1" width="1" height="2" fill="#1f2335" />
          <rect x="11" y="2" width="1" height="2" fill="#ff007f" />
          <rect x="10" y="2" width="1" height="2" fill="#1f2335" />
          <rect x="3" y="4" width="9" height="1" fill="#1f2335" />
          <rect x="2" y="5" width="11" height="3" fill="#1f2335" />
          <!-- Neon Cyan Eyes with Blinking -->
          <rect x="4" y="6" width="1" height="1" fill="#00f0ff">
            <animate attributeName="height" values="1;1;0.1;1;1" dur="4s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" />
            <animate attributeName="y" values="6;6;6.45;6;6" dur="4s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" />
          </rect>
          <rect x="10" y="6" width="1" height="1" fill="#00f0ff">
            <animate attributeName="height" values="1;1;0.1;1;1" dur="4s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" />
            <animate attributeName="y" values="6;6;6.45;6;6" dur="4s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" />
          </rect>
          <!-- Cheeks -->
          <rect x="3" y="7" width="1" height="1" fill="#7aa2f7" />
          <rect x="11" y="7" width="1" height="1" fill="#7aa2f7" />
          <!-- Nose & Mouth -->
          <rect x="7" y="7" width="1" height="1" fill="#ff007f" />
          <!-- Body -->
          <rect x="3" y="8" width="9" height="6" fill="#1f2335" />
          <!-- Paws -->
          <rect x="4" y="14" width="2" height="1" fill="#00f0ff" />
          <rect x="9" y="14" width="2" height="1" fill="#00f0ff" />
        </g>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT CAT (Neon Pink Cyber-Calico) ================= -->
  <g class="right-cat-container">
    <g class="cat-wobble" style="animation-delay: 0.1s;">
      <g class="cat-breath" style="animation-delay: 0.5s;">
        <g transform="scale(3)" shape-rendering="crispEdges">
          <!-- Tail -->
          <g class="tail-right">
            <rect x="13" y="11" width="1" height="2" fill="#ff007f" />
            <rect x="14" y="9" width="1" height="2" fill="#ff007f" />
            <rect x="13" y="8" width="1" height="1" fill="#ff007f" />
          </g>
          <!-- Body/Head -->
          <rect x="2" y="1" width="1" height="2" fill="#ff007f" />
          <rect x="3" y="2" width="1" height="2" fill="#00f0ff" />
          <rect x="4" y="2" width="1" height="2" fill="#ff007f" />
          <rect x="12" y="1" width="1" height="2" fill="#ff007f" />
          <rect x="11" y="2" width="1" height="2" fill="#00f0ff" />
          <rect x="10" y="2" width="1" height="2" fill="#ff007f" />
          <rect x="3" y="4" width="5" height="1" fill="#ff007f" />
          <rect x="8" y="4" width="3" height="1" fill="#00f0ff" />
          <rect x="2" y="5" width="6" height="1" fill="#ff007f" />
          <rect x="8" y="5" width="4" height="1" fill="#00f0ff" />
          <rect x="12" y="5" width="1" height="1" fill="#ff007f" />
          <rect x="2" y="6" width="11" height="1" fill="#ff007f" />
          <!-- Neon Cyan Eyes with Blinking -->
          <rect x="4" y="6" width="1" height="1" fill="#00f0ff">
            <animate attributeName="height" values="1;1;0.1;1;1" dur="4s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" />
            <animate attributeName="y" values="6;6;6.45;6;6" dur="4s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" />
          </rect>
          <rect x="10" y="6" width="1" height="1" fill="#00f0ff">
            <animate attributeName="height" values="1;1;0.1;1;1" dur="4s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" />
            <animate attributeName="y" values="6;6;6.45;6;6" dur="4s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" />
          </rect>
          <!-- Cheeks -->
          <rect x="3" y="7" width="1" height="1" fill="#fafafa" />
          <rect x="11" y="7" width="1" height="1" fill="#fafafa" />
          <!-- Nose & Mouth -->
          <rect x="7" y="7" width="1" height="1" fill="#00f0ff" />
          <!-- Body -->
          <rect x="3" y="8" width="9" height="1" fill="#ff007f" />
          <rect x="3" y="9" width="2" height="1" fill="#1f2335" />
          <rect x="5" y="9" width="7" height="1" fill="#ff007f" />
          <rect x="3" y="10" width="3" height="1" fill="#1f2335" />
          <rect x="6" y="10" width="6" height="1" fill="#ff007f" />
          <rect x="3" y="11" width="9" height="3" fill="#ff007f" />
          <!-- Paws -->
          <rect x="4" y="14" width="2" height="1" fill="#fafafa" />
          <rect x="9" y="14" width="2" height="1" fill="#fafafa" />
        </g>
      </g>
    </g>
  </g>
</svg>
