<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280">
  <defs>
    <!-- Glow effects -->
    <filter id="neon-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neon-glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    .grid-border {
      fill: #1a1b26;
      stroke: #3b4261;
      stroke-width: 2;
    }

    .slot-border {
      fill: #1f2335;
      stroke: #24283b;
      stroke-width: 2;
    }

    .label-title {
      font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
      font-size: 18px;
      fill: #ff007f;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .tech-label {
      font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
      font-size: 10px;
      fill: #c0caf5;
      font-weight: bold;
      text-anchor: middle;
    }

    .tech-class {
      font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
      font-size: 7px;
      fill: #7aa2f7;
      text-anchor: middle;
    }

    /* 8-Bit Icon Animations */
    @keyframes steam-rise {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-2px); opacity: 1; }
    }
    .java-steam-1 {
      animation: steam-rise 1.4s steps(3) infinite;
    }
    .java-steam-2 {
      animation: steam-rise 1.4s steps(3) infinite;
      animation-delay: 0.7s;
    }

    @keyframes tongue-flicker {
      0%, 80%, 100% { opacity: 0; }
      40%, 60% { opacity: 1; }
    }
    .python-tongue {
      animation: tongue-flicker 2.5s steps(1) infinite;
    }

    @keyframes js-glow {
      0%, 100% { fill: #1a1b26; }
      50% { fill: #e0af68; }
    }
    .js-text {
      animation: js-glow 3s steps(1) infinite;
    }

    @keyframes ts-glow {
      0%, 100% { fill: #1a1b26; }
      50% { fill: #fafafa; }
    }
    .ts-text {
      animation: ts-glow 3s steps(1) infinite;
      animation-delay: 1.5s;
    }

    @keyframes kotlin-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }
    .kotlin-logo {
      animation: kotlin-pulse 2s steps(2) infinite;
    }

    @keyframes cpp-flash {
      0%, 100% { fill: #00f0ff; }
      50% { fill: #ff007f; }
    }
    .cpp-plus {
      animation: cpp-flash 1.2s steps(1) infinite;
    }

    @keyframes csharp-glow {
      0%, 100% { fill: #00f0ff; }
      50% { fill: #fafafa; }
    }
    .csharp-hash {
      animation: csharp-glow 1.5s steps(1) infinite;
    }

    @keyframes swift-hover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1px); }
    }
    .swift-bird {
      animation: swift-hover 1.2s steps(2) infinite;
    }

    @keyframes gopher-look {
      0%, 60%, 100% { transform: translateX(0); }
      20%, 40% { transform: translateX(-1px); }
      70%, 90% { transform: translateX(1px); }
    }
    .gopher-pupil {
      animation: gopher-look 5s steps(1) infinite;
    }

    /* Intro Open animation */
    @keyframes panel-open {
      0% { transform: scaleX(0.01); opacity: 0.8; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    .grid-border {
      transform-origin: 400px 140px;
      animation: panel-open 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes content-reveal {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .panel-content {
      animation: content-reveal 0.4s ease-out 0.6s forwards;
      opacity: 0;
    }
    ]]>
  </style>

  <!-- ================= MAIN CONTAINER ================= -->
  <rect x="10" y="10" width="780" height="260" rx="8" class="grid-border" />

  <!-- Header Title -->
  <g class="panel-content">
  <text x="400" y="35" text-anchor="middle" class="label-title" filter="url(#neon-glow-pink)">TECH STACK</text>

  <!-- ================= ROW 1 (Y centers = 95) ================= -->
  
  <!-- Java (Slot 1: X=120) -->
  <g transform="translate(120, 95)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Steam -->
      <rect x="5" y="0" width="1" height="2" fill="#ff9e64" class="java-steam-1" />
      <rect x="9" y="0" width="1" height="2" fill="#ff9e64" class="java-steam-2" />
      <!-- Cup -->
      <rect x="3" y="3" width="8" height="6" fill="#f75c7f" />
      <rect x="2" y="3" width="1" height="5" fill="#f75c7f" />
      <!-- Handle -->
      <rect x="11" y="4" width="2" height="3" fill="#fafafa" />
      <rect x="12" y="5" width="1" height="1" fill="#1f2335" />
      <!-- Plate -->
      <rect x="1" y="9" width="12" height="1" fill="#fafafa" />
    </g>
    <text x="0" y="20" class="tech-label">JAVA</text>
    <text x="0" y="32" class="tech-class">SYSTEMS</text>
  </g>

  <!-- Python (Slot 2: X=260) -->
  <g transform="translate(260, 95)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Blue Snake -->
      <rect x="2" y="1" width="6" height="3" fill="#7aa2f7" />
      <rect x="5" y="4" width="6" height="3" fill="#7aa2f7" />
      <!-- Tongue -->
      <rect x="1" y="3" width="1" height="1" fill="#ff007f" class="python-tongue" />
      <!-- Yellow Snake -->
      <rect x="6" y="5" width="6" height="3" fill="#e0af68" />
      <rect x="3" y="2" width="6" height="3" fill="#e0af68" />
      <!-- Eyes -->
      <rect x="3" y="2" width="1" height="1" fill="#1a1b26" />
      <rect x="10" y="6" width="1" height="1" fill="#1a1b26" />
    </g>
    <text x="0" y="20" class="tech-label">PYTHON</text>
    <text x="0" y="32" class="tech-class">SCRIPTING</text>
  </g>

  <!-- JavaScript (Slot 3: X=400) -->
  <g transform="translate(400, 95)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Background box -->
      <rect x="1" y="1" width="12" height="10" fill="#e0af68" />
      <!-- J -->
      <rect x="3" y="7" width="3" height="1" fill="#1a1b26" class="js-text" />
      <rect x="5" y="4" width="1" height="3" fill="#1a1b26" class="js-text" />
      <!-- S -->
      <rect x="7" y="4" width="3" height="1" fill="#1a1b26" class="js-text" />
      <rect x="7" y="5" width="1" height="1" fill="#1a1b26" class="js-text" />
      <rect x="8" y="6" width="2" height="1" fill="#1a1b26" class="js-text" />
      <rect x="9" y="7" width="1" height="1" fill="#1a1b26" class="js-text" />
      <rect x="7" y="8" width="3" height="1" fill="#1a1b26" class="js-text" />
    </g>
    <text x="0" y="20" class="tech-label">JS</text>
    <text x="0" y="32" class="tech-class">WEB APP</text>
  </g>

  <!-- TypeScript (Slot 4: X=540) -->
  <g transform="translate(540, 95)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Background box -->
      <rect x="1" y="1" width="12" height="10" fill="#00f0ff" />
      <!-- T -->
      <rect x="3" y="4" width="3" height="1" fill="#1a1b26" class="ts-text" />
      <rect x="4" y="5" width="1" height="4" fill="#1a1b26" class="ts-text" />
      <!-- S -->
      <rect x="7" y="4" width="3" height="1" fill="#1a1b26" class="ts-text" />
      <rect x="7" y="5" width="1" height="1" fill="#1a1b26" class="ts-text" />
      <rect x="8" y="6" width="2" height="1" fill="#1a1b26" class="ts-text" />
      <rect x="9" y="7" width="1" height="1" fill="#1a1b26" class="ts-text" />
      <rect x="7" y="8" width="3" height="1" fill="#1a1b26" class="ts-text" />
    </g>
    <text x="0" y="20" class="tech-label">TS</text>
    <text x="0" y="32" class="tech-class">FRONTEND</text>
  </g>

  <!-- Kotlin (Slot 5: X=680) -->
  <g transform="translate(680, 95)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" class="kotlin-logo" shape-rendering="crispEdges">
      <!-- Kotlin Diagonal Flag -->
      <rect x="1" y="1" width="12" height="10" fill="#bd00ff" />
      <path d="M1,1 H13 L1,11 Z" fill="#ff007f" />
      <path d="M5,1 H13 V9 Z" fill="#ff9e64" />
    </g>
    <text x="0" y="20" class="tech-label">KOTLIN</text>
    <text x="0" y="32" class="tech-class">ANDROID</text>
  </g>

  <!-- ================= ROW 2 (Y centers = 195) ================= -->
  
  <!-- C (Slot 6: X=120) -->
  <g transform="translate(120, 195)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Shield Body -->
      <rect x="1" y="1" width="12" height="7" fill="#f75c7f" />
      <path d="M1,8 h12 v1 h-1 v1 h-1 v1 h-1 v1 h-2 v-1 h-1 v-1 h-1 v-1 h-1 v-1 h-1 v-1 H1 z" fill="#f75c7f" />
      <!-- Outer border highlight -->
      <rect x="2" y="2" width="10" height="1" fill="#fafafa" />
      <!-- Inner C -->
      <rect x="4" y="4" width="3" height="1" fill="#fafafa" />
      <rect x="4" y="5" width="1" height="1" fill="#fafafa" />
      <rect x="4" y="6" width="3" height="1" fill="#fafafa" />
    </g>
    <text x="0" y="20" class="tech-label">C</text>
    <text x="0" y="32" class="tech-class">LOW LEVEL</text>
  </g>

  <!-- C++ (Slot 7: X=260) -->
  <g transform="translate(260, 195)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Shield Body -->
      <rect x="1" y="1" width="12" height="7" fill="#7aa2f7" />
      <path d="M1,8 h12 v1 h-1 v1 h-1 v1 h-1 v1 h-2 v-1 h-1 v-1 h-1 v-1 h-1 v-1 h-1 v-1 H1 z" fill="#7aa2f7" />
      <!-- Outer border highlight -->
      <rect x="2" y="2" width="10" height="1" fill="#b4f9f8" />
      <!-- Inner C -->
      <rect x="3" y="4" width="2" height="3" fill="#fafafa" />
      <!-- Plus signs -->
      <rect x="6" y="5" width="3" height="1" fill="#00f0ff" class="cpp-plus" />
      <rect x="7" y="4" width="1" height="3" fill="#00f0ff" class="cpp-plus" />
      <rect x="9" y="5" width="3" height="1" fill="#00f0ff" class="cpp-plus" />
      <rect x="10" y="4" width="1" height="3" fill="#00f0ff" class="cpp-plus" />
    </g>
    <text x="0" y="20" class="tech-label">C++</text>
    <text x="0" y="32" class="tech-class">GRAPHICS</text>
  </g>

  <!-- C# (Slot 8: X=400) -->
  <g transform="translate(400, 195)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Shield Body -->
      <rect x="1" y="1" width="12" height="7" fill="#bd00ff" />
      <path d="M1,8 h12 v1 h-1 v1 h-1 v1 h-1 v1 h-2 v-1 h-1 v-1 h-1 v-1 h-1 v-1 h-1 v-1 H1 z" fill="#bd00ff" />
      <!-- Outer border highlight -->
      <rect x="2" y="2" width="10" height="1" fill="#fafafa" />
      <!-- Inner C -->
      <rect x="3" y="4" width="2" height="3" fill="#fafafa" />
      <!-- Hash sign # -->
      <rect x="7" y="4" width="1" height="4" fill="#00f0ff" class="csharp-hash" />
      <rect x="9" y="4" width="1" height="4" fill="#00f0ff" class="csharp-hash" />
      <rect x="6" y="5" width="5" height="1" fill="#00f0ff" class="csharp-hash" />
      <rect x="6" y="7" width="5" height="1" fill="#00f0ff" class="csharp-hash" />
    </g>
    <text x="0" y="20" class="tech-label">C#</text>
    <text x="0" y="32" class="tech-class">ENGINES</text>
  </g>

  <!-- Swift (Slot 9: X=540) -->
  <g transform="translate(540, 195)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Swift Bird -->
      <rect x="9" y="1" width="3" height="1" fill="#ff9e64" class="swift-bird" />
      <rect x="7" y="2" width="5" height="1" fill="#ff9e64" class="swift-bird" />
      <rect x="5" y="3" width="6" height="1" fill="#ff9e64" class="swift-bird" />
      <rect x="4" y="4" width="6" height="1" fill="#ff9e64" class="swift-bird" />
      <rect x="2" y="5" width="7" height="1" fill="#ff9e64" class="swift-bird" />
      <rect x="1" y="6" width="6" height="1" fill="#ff9e64" class="swift-bird" />
      <rect x="1" y="7" width="6" height="1" fill="#ff9e64" class="swift-bird" />
      <rect x="1" y="8" width="3" height="1" fill="#ff9e64" class="swift-bird" />
    </g>
    <text x="0" y="20" class="tech-label">SWIFT</text>
    <text x="0" y="32" class="tech-class">IOS / OSX</text>
  </g>

  <!-- Go (Slot 10: X=680) -->
  <g transform="translate(680, 195)">
    <rect x="-40" y="-40" width="80" height="80" rx="8" class="slot-border" />
    <g transform="translate(-20, -30) scale(2.8)" shape-rendering="crispEdges">
      <!-- Head -->
      <rect x="2" y="2" width="10" height="8" fill="#b4f9f8" />
      <!-- Hair/Cap -->
      <rect x="4" y="1" width="6" height="1" fill="#e0af68" />
      <!-- Eyes -->
      <rect x="3" y="3" width="3" height="3" fill="#fafafa" />
      <rect x="8" y="3" width="3" height="3" fill="#fafafa" />
      <rect x="4" y="4" width="1" height="1" fill="#1a1b26" class="gopher-pupil" />
      <rect x="9" y="4" width="1" height="1" fill="#1a1b26" class="gopher-pupil" />
      <!-- Nose -->
      <rect x="6" y="6" width="2" height="1" fill="#ff9e64" />
      <!-- Teeth -->
      <rect x="5" y="8" width="4" height="1" fill="#fafafa" />
    </g>
    <text x="0" y="20" class="tech-label">GOLANG</text>
    <text x="0" y="32" class="tech-class">BACKEND</text>
  </g>
  </g>
</svg>
